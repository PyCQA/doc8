---
name: tox

on:
  merge_group:
  push:
    branches:
      - "main"

  pull_request:
    branches:
      - "main"
  schedule:
    - cron: "0 0 * * *"
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1 # tox, pytest, ansible-lint
  PY_COLORS: 1

jobs:
  build:
    name: ${{ matrix.tox_env }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tox_env: py310, python_version: "3.10"}
          - {tox_env: py311, python_version: "3.11"}
          - {tox_env: py312, python_version: "3.12"}
          - {tox_env: py313, python_version: "3.13"}
          - {tox_env: py314, python_version: "3.14"}
          - {tox_env: lint, python_version: "3.10"}
          - {tox_env: packaging, python_version: "3.10"}
          - {tox_env: docs, python_version: "3.10"}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed by setuptools-scm
          submodules: true

      - name: Set pre-commit cache
        uses: actions/cache@v4
        if: ${{ matrix.tox_env == 'lint' }}
        with:
          path: |
            ~/.cache/pre-commit
          key: pre-commit-${{ matrix.tox_env }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Set up Python ${{ matrix.python_version }}
        uses: actions/setup-python@v5
        with:
          cache: pip
          python-version: ${{ matrix.python_version }}


      - name: Install tox
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade "tox>=4.0.0" "tox-uv>=1.25.0" "uv>=0.6.6"

      - name: Log installed dists
        run: python3 -m pip freeze --all

      - run: tox -e ${{ matrix.tox_env }}

      - name: Archive logs
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.tox_env }}
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            .tox/**/.coverage*
            .tox/**/coverage.xml

      - name: Report failure if git reports dirty status
        run: |
          if [[ -n $(git status -s) ]]; then
            echo -n '::error file=git-status::'
            # shellcheck disable=SC2016
            printf '### Failed as git reported modified and/or untracked files\n```\n%s\n```\n' "$(git status -s)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 99
          fi
  check:
    if: always()
    permissions:
      id-token: write
      checks: read
    needs:
      - build
    runs-on: ubuntu-24.04

    steps:
      # checkout needed for codecov action which needs codecov.yml file
      - uses: actions/checkout@v4

      - name: Set up Python # likely needed for coverage
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip3 install 'coverage>=7.5.1'

      - name: Download artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true # to allow rerunning this job
        with:
          pattern: logs-*
          merge-multiple: true
          path: .


      - name: Upload coverage data
        uses: codecov/codecov-action@v7.1.1
        with:
          # verbose: true # optional (default = false)
          fail_ci_if_error: true
          use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }} # cspell:ignore oidc

      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
